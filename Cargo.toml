[package]
name = "airobot"
version = "0.6.0"
edition = "2021"
description = "Open-source AI team for small businesses: AI agents that run sales, bookings, support and invoices in one chat"
license = "AGPL-3.0-only"
keywords = ["ai-agents", "multi-agent", "self-hosted", "crm", "automation"]
repository = "https://github.com/azavibe/airo-bot"
homepage = "https://airo-bot.com"
# `cargo run` with no --bin starts the server (there is also airobot-cli).
default-run = "airobot"

[[bin]]
name = "airobot"
path = "src/main.rs"

[[bin]]
name = "airobot-cli"
path = "src/bin/airobot-cli.rs"


# Do not add tower or hyper directly -- they arrive with axum.
[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower_governor = "0.7"
# Transitive dependencies of axum-extra (cookie expiry) and tower_governor
# (rate-limiter middleware type) whose types appear directly in our own
# function signatures -- not new functionality, just plumbing.
time = "0.3"
governor = "0.8"
dotenvy = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
sha2 = "0.10"
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
] }
askama = "0.12"
rand = "0.8"
# default-features off: comrak's defaults pull in syntect (syntax
# highlighting, needs a C compiler for Oniguruma) and a `clap` CLI we never
# use -- the allowlist below has no room for highlighted code blocks anyway.
comrak = { version = "0.54.0", default-features = false }
ammonia = "4.2.5"
# Standards-compliant payload encryption and VAPID signing, implemented with
# Rust cryptography so local and Docker builds need no system OpenSSL toolchain.
web-push-native = { version = "0.5", features = ["vapid"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tower-http = { version = "0.6", features = ["fs"] }
# Encrypts third-party provider keys (e.g. OpenRouter) at rest. They must be
# recoverable to call the provider, so the Argon2-hash rule cannot apply;
# already in the tree through web-push-native.
aes-gcm = "0.10"
# Derives per-task webhook tokens so no raw webhook secret is ever stored.
hmac = "0.12"
# Text out of uploaded office documents (PDF and Word files); reading only.
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
base64 = "0.22"


[dev-dependencies]
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "migrate"] }
# Test-only: drives the real `Router` in-process (axum's own documented way
# to integration-test a handler) instead of a separate HTTP client crate.
# Already in the dependency tree via axum itself; not used by the shipped
# binary.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
# Rust builds are CPU-heavy already on a shared 4-vCPU box; a smaller binary
# is not worth trading for a much slower build via LTO here.
lto = false
