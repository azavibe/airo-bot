<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airobot</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #000; color: #f3f4f6;
         font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  /* The window has no system title bar: this is its drag area and buttons. */
  .bar { height: 36px; flex-shrink: 0; display: flex; align-items: stretch; justify-content: space-between;
         padding-left: 14px; user-select: none; }
  .bar.mac { padding-left: 76px; }
  .bar .name { display: flex; align-items: center; font-size: 12px; color: #a3a3a3; }
  .bar .btns { display: flex; }
  .bar.mac .btns { display: none; }
  .bar button { width: 44px; border: 0; background: transparent; color: #a3a3a3; cursor: default;
                display: flex; align-items: center; justify-content: center; }
  .bar button:hover { background: rgba(255,255,255,.1); color: #fff; }
  .bar button.close:hover { background: #dc2626; }
  .main { flex: 1; display: flex; align-items: center; justify-content: center; }
  .card { max-width: 420px; padding: 32px; text-align: center; }
  .spin { width: 28px; height: 28px; margin: 0 auto 18px; border-radius: 50%;
          border: 2px solid rgba(255,255,255,.15); border-top-color: #fff; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  p { font-size: 13px; color: #a3a3a3; line-height: 1.5; margin: 0; }
  .error h1 { color: #fca5a5; }
  code { display: block; margin-top: 14px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.06);
         color: #e5e5e5; font-size: 12px; text-align: left; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<div class="bar" id="bar" data-tauri-drag-region>
  <span class="name" data-tauri-drag-region>Airobot</span>
  <span class="btns">
    <button type="button" id="min" aria-label="Minimize" title="Minimize">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
    </button>
    <button type="button" id="max" aria-label="Maximize" title="Maximize">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
    </button>
    <button type="button" id="close" class="close" aria-label="Close" title="Close (Airobot keeps running in the tray)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </span>
</div>
<div class="main">
<div class="card" id="card">
  <div class="spin"></div>
  <h1>Starting Airobot on this computer…</h1>
  <p>Opening your office. The first start takes a little longer while your private database is created.</p>
</div>
</div>
<script>
  // Window buttons (the desktop app draws no system title bar).
  var tauriWindow = window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.getCurrentWindow();
  if (/Mac/i.test(navigator.platform || navigator.userAgent)) document.getElementById('bar').className = 'bar mac';
  if (tauriWindow) {
    document.getElementById('min').onclick = function () { tauriWindow.minimize(); };
    document.getElementById('max').onclick = function () { tauriWindow.toggleMaximize(); };
    document.getElementById('close').onclick = function () { tauriWindow.close(); };
  } else {
    document.getElementById('bar').style.display = 'none';
  }

  // The desktop app adds ?error=... if the local database could not start.
  var error = new URLSearchParams(location.search).get('error');
  if (error) {
    var card = document.getElementById('card');
    card.className = 'card error';
    card.innerHTML = '<h1>Airobot could not start on this computer</h1>' +
      '<p>Quit Airobot from the tray icon and open it again. If it keeps happening, you can still use Airobot Cloud from the tray menu.</p>';
    var code = document.createElement('code');
    code.textContent = error;
    card.appendChild(code);
  }
</script>
</body>
</html>
