{% extends "app.html" %}
{% block title %}{{ title }} — Air{% endblock %}
{% block app_content %}
<div style="max-width: 480px; margin: 40px auto; padding: 0 16px;">
  <h1 class="page-h" style="font-size: 1.5rem; margin-bottom: 0.75rem;">{{ title }}</h1>
  <p class="page-lede" style="font-size: 1rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 1.5rem;">{{ body }}</p>
  <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;">
    <a class="btn btn-primary" href="/connect?view=agents" title="Go to Connected Agents">View Connected Agents &rarr;</a>
    <a class="btn btn-outline" href="/boards" title="Go to Workspaces">Workspaces</a>
    <a class="btn btn-quiet" href="/" title="Go to Feed">Feed</a>
  </div>
</div>
{% endblock %}
