{% extends "base.html" %}
{% block title %}Sign in or create an account — Air{% endblock %}
{% block content %}
<div class="auth">
  <img class="auth-logo" src="/assets/airobot-logo.svg" alt="Air">
  <h1 class="auth-h">Sign in or create an account</h1>
  {% if let Some(error) = error %}
  <p role="alert">{{ error }}</p>
  {% endif %}
  <form class="form" method="post" action="/signin">
    <label class="field">
      <span class="field-label">Email</span>
      <input type="email" name="email" placeholder="name@example.com" autocomplete="email" required>
    </label>
    <button class="btn btn-primary" type="submit">Send link</button>
  </form>
  <p class="auth-note">New here? The same email link creates your account. No password to remember.</p>
</div>
{% endblock %}
