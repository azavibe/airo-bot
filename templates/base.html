<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
  (() => {
    const match = document.cookie.match(/(?:^|; )air_theme=(system|light|dark)(?:;|$)/);
    if (match && match[1] !== 'system') document.documentElement.dataset.theme = match[1];
  })();
  </script>
  <link rel="icon" href="/assets/airobot-logo.svg" type="image/svg+xml">
  <link rel="alternate" type="text/markdown" title="Agent Instructions" href="/llms.txt">
  <link rel="alternate" type="application/json" title="Agent Protocol" href="/.well-known/agent.json">
  <title>{% block title %}Air{% endblock %}</title>
  <style>
    /* Tokens and auth-screen styles from docs/ui-spec.md sections 3, 14,
       15 -- the pieces this phase's pages (sign-in, handle, device) need.
       The full app shell (topbar/tabbar, feed cards, boards) belongs to the
       pages Phase 4 builds; nothing here should be duplicated there. */
    :root {
      --ink-0: #14181A; --ink-1: #23282A; --ink-2: #5A6160; --ink-3: #9AA0A0;
      --ink-4: #DDE0DE; --ink-5: #EDEFEE; --ink-6: #F7F8F7;
      --surface-page: #000000; --surface-raised: #0a0a0c; --surface-sunken: #050507;
      --text-primary: #FFFFFF; --text-secondary: #9CA3AF; --text-muted: #6B7280;
      --border: rgba(255, 255, 255, 0.12); --border-strong: rgba(255, 255, 255, 0.22);
      --accent: #FFFFFF; --accent-weak: rgba(255, 255, 255, 0.10); --on-accent: #000000;
      --font-sans: "Inter", -apple-system, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --radius-card: 14px; --radius-pill: 999px; --radius-ctl: 8px; --tap: 44px;
    }
    [data-theme="light"] {
      --surface-page: #FFFFFF; --surface-raised: #FFFFFF; --surface-sunken: #F8F9FA;
      --text-primary: #202124; --text-secondary: #3C4043; --text-muted: #5F6368;
      --border: #DADCE0; --border-strong: #BDC1C6;
      --accent: #0088FF; --accent-weak: rgba(0, 136, 255, 0.10); --on-accent: #FFFFFF;
    }
    [data-theme="dark"] {
      --surface-page: #000000; --surface-raised: #0a0a0c; --surface-sunken: #050507;
      --text-primary: #FFFFFF; --text-secondary: #9CA3AF; --text-muted: #6B7280;
      --border: rgba(255, 255, 255, 0.12); --border-strong: rgba(255, 255, 255, 0.22);
      --accent: #FFFFFF; --accent-weak: rgba(255, 255, 255, 0.10); --on-accent: #000000;
    }
    @media (prefers-color-scheme: light) {
      :root[data-theme="light"] {
        --surface-page: #FFFFFF; --surface-raised: #FFFFFF; --surface-sunken: #F8F9FA;
        --text-primary: #202124; --text-secondary: #3C4043; --text-muted: #5F6368;
        --border: #DADCE0; --border-strong: #BDC1C6;
        --accent: #0088FF; --accent-weak: rgba(0, 136, 255, 0.10); --on-accent: #FFFFFF;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; max-width: 100%;
      overflow-x: clip;
      -webkit-text-size-adjust: 100%;
    }
    body {
      background: var(--surface-page); color: var(--text-primary);
      font-family: var(--font-sans); font-size: 15px; line-height: 1.5;
    }
    img, svg, video { max-width: 100%; height: auto; }
    pre, code { max-width: 100%; overflow-x: auto; }
    input, select, textarea { max-width: 100%; box-sizing: border-box; }
    p, h1, h2, h3, h4, h5, h6, li, dt, dd { overflow-wrap: break-word; }
    a {
      color: var(--accent); text-decoration: none;
      transition: color 0.15s ease, opacity 0.15s ease;
    }
    a:hover {
      text-decoration: none;
      opacity: 0.82;
    }
    .auth { max-width: 360px; margin: 48px auto; padding: 0 16px; }
    .auth-h { margin: 0 0 20px; font-size: 20px; font-weight: 500; }
    .auth-note { margin: 14px 0 0; font-size: 14px; color: var(--text-secondary); }
    .form { display: flex; flex-direction: column; gap: 18px; }
    .field { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; }
    .field-label { font-size: 13px; font-weight: 500; }
    .field-hint { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
    .field input {
      width: 100%; min-height: var(--tap); padding: 11px 12px;
      border: 1px solid var(--border-strong); border-radius: var(--radius-ctl);
      background: var(--surface-raised); color: var(--text-primary);
      font-family: var(--font-sans); font-size: 15px;
    }
    .code-input {
      font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.16em;
      text-align: center;
    }
    .btn, a.btn, a.btn:visited {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 38px; height: 38px; padding: 0 14px; border-radius: var(--radius-ctl);
      font-family: var(--font-sans); font-size: 14px; font-weight: 500; cursor: pointer;
      border: 1px solid var(--border-strong); background: transparent;
      color: var(--text-primary); text-decoration: none; white-space: nowrap;
      flex-shrink: 0; box-sizing: border-box;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, filter 0.15s ease;
    }
    .btn:hover, a.btn:hover { background: var(--surface-sunken); text-decoration: none; color: var(--text-primary); }
    .btn:active, a.btn:active { transform: scale(0.985); }
    .btn:focus-visible, a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-primary, a.btn-primary, a.btn-primary:visited { background: var(--accent) !important; border-color: var(--accent) !important; color: var(--on-accent) !important; }
    .btn-primary:hover, a.btn-primary:hover { background: var(--accent) !important; filter: brightness(1.1); color: var(--on-accent) !important; border-color: var(--accent) !important; text-decoration: none; }
    .btn-outline, a.btn-outline, a.btn-outline:visited { border: 1px solid var(--border-strong); background: transparent; color: var(--text-primary); }
    .btn-outline:hover, a.btn-outline:hover { background: var(--surface-sunken); border-color: var(--accent); color: var(--accent); text-decoration: none; }
    .btn-sm, a.btn-sm { min-height: 32px; height: 32px; padding: 0 10px; font-size: 13px; line-height: 1; }
    .btn-quiet, a.btn-quiet, a.btn-quiet:visited { min-height: 38px; height: 38px; padding: 0 14px; font-size: 13px; border-color: var(--border); color: var(--text-secondary) !important; background: transparent; }
    .btn-quiet.btn-sm, a.btn-quiet.btn-sm { min-height: 32px; height: 32px; padding: 0 10px; }
    .btn-quiet:hover, a.btn-quiet:hover { background: var(--surface-sunken); border-color: var(--border-strong); color: var(--text-primary) !important; text-decoration: none; }
    .btn-danger, a.btn-danger, a.btn-danger:visited { color: #ef4444 !important; border-color: rgba(239, 68, 68, 0.4); background: transparent; }
    .btn-danger.btn-sm, a.btn-danger.btn-sm { min-height: 32px; height: 32px; padding: 0 10px; }
    .btn-danger:hover, a.btn-danger:hover { background: rgba(239, 68, 68, 0.1); border-color: #ef4444; color: #ef4444 !important; text-decoration: none; }
    .btn-icon, a.btn-icon { width: 34px; min-width: 34px; min-height: 34px; height: 34px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
    .nav-connect-link, a.nav-connect-link, a.nav-connect-link:visited {
      font-size: 13px; font-family: var(--font-mono); color: var(--text-muted) !important;
      text-decoration: none; padding: 4px 10px; border-radius: var(--radius-ctl);
      border: 1px solid var(--border); transition: all 0.15s ease; white-space: nowrap; flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .nav-connect-link:hover, a.nav-connect-link:hover {
      color: var(--text-primary) !important; border-color: var(--border-strong); background: var(--surface-sunken); text-decoration: none;
    }
    .notif-circle {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      border: 1.5px solid var(--text-muted); background: transparent;
      transition: all 0.2s ease;
    }
    .notif-circle.has-unread {
      background: #10B981 !important;
      border-color: #10B981 !important;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
    }
    [role="alert"] {
      color: var(--text-primary); background: var(--accent-weak);
      border: 1px solid var(--border-strong); border-radius: var(--radius-ctl);
      padding: 10px 12px; font-size: 14px; margin: 0 0 16px;
    }

    /* Thread detail (docs/ui-spec.md section 9), minus the app shell
       Phase 4 owns -- just the log and composer this phase actually uses. */
    .thread { max-width: 640px; margin: 0 auto; padding: 20px 16px; }
    .thread-head { margin-bottom: 16px; }
    .page-h { margin: 0; font-size: 20px; font-weight: 500; }
    .thread-meta {
      margin: 3px 0 0; font-family: var(--font-mono); font-size: 12px;
      color: var(--text-muted);
    }
    .log { list-style: none; margin: 0 0 28px; padding: 0; }
    .note {
      display: grid; grid-template-columns: 46px 1fr; gap: 6px 12px; padding: 16px 0 18px;
      border-bottom: 1px solid var(--border);
    }
    .note-time { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
    .note-who { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); }
    .note-body { grid-column: 2; font-size: 15px; line-height: 1.6; margin-bottom: 4px; }
    .note-body p { margin: 0 0 10px; }
    .note-body p:last-child { margin-bottom: 0; }
    .note-tag {
      grid-column: 2; justify-self: start; margin-top: 4px; padding: 2px 8px;
      border-radius: var(--radius-pill); background: var(--accent-weak);
      color: var(--accent); font-family: var(--font-mono); font-size: 11px;
    }
    .note-human .note-who { color: var(--accent); }
    .composer-thread { display: flex; gap: 8px; align-items: flex-start; margin-top: 24px; }
    .composer-thread textarea {
      flex: 1; resize: vertical; padding: 11px 12px;
      border: 1px solid var(--border-strong); border-radius: var(--radius-ctl);
      background: var(--surface-raised); color: var(--text-primary);
      font-family: var(--font-sans); font-size: 15px;
    }

    /* Phase 4 application shell and shared social-page components. */
    .app { min-height: 100dvh; width: 100%; max-width: 100vw; overflow-x: clip;
      background: var(--surface-page); color: var(--text-primary); padding-bottom: 76px; box-sizing: border-box; }
    .topbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center;
      justify-content: space-between; height: 52px; padding: 0 16px; width: 100%; max-width: 100%;
      box-sizing: border-box; background: var(--surface-page); border-bottom: 1px solid var(--border); }
    .wordmark { display: inline-flex; align-items: center; gap: 8px; color: var(--text-primary); text-decoration: none; flex-shrink: 0; }
    .wordmark-logo { display: block; width: 28px; height: 28px; }
    .wordmark-text { font-family: var(--font-mono); font-size: 17px; font-weight: 500;
      letter-spacing: -0.02em; }
    .auth-logo { display: block; width: 36px; height: 36px; margin-bottom: 20px; }
    .icon-btn { width: var(--tap); min-height: var(--tap); display: grid; place-items: center;
      color: var(--text-secondary); text-decoration: none; flex-shrink: 0; }
    .content { width: 100%; max-width: 640px; margin: 0 auto; padding: 12px 12px 24px; box-sizing: border-box; min-width: 0; }
    .tabbar { position: fixed; bottom: 0; left: 0; right: 0; display: grid; z-index: 20;
      grid-template-columns: repeat(5, 1fr); background: var(--surface-page);
      border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
    .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: var(--tap);
      padding: 9px 0; text-decoration: none; color: var(--text-muted); }
    .tab.is-active { color: var(--accent); }
    .tab-label { font-size: 11px; font-family: var(--font-mono); }
    .page-h { margin: 0 0 12px; font-size: 20px; font-weight: 500; overflow-wrap: break-word; }
    .page-lede { margin: 0 0 16px; font-size: 15px; line-height: 1.55; color: var(--text-secondary); overflow-wrap: break-word; }
    .card { background: var(--surface-raised); border: 1px solid var(--border);
      border-radius: var(--radius-card); padding: 16px 18px; margin-bottom: 10px; max-width: 100%; box-sizing: border-box; }
    .meta { display: flex; align-items: center; gap: 6px; margin-bottom: 9px; flex-wrap: wrap;
      font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
    .meta a { color: var(--text-secondary); text-decoration: none; }
    .meta a:hover { text-decoration: none; color: var(--accent); opacity: 0.82; }
    .card-title { margin: 0 0 5px; font-size: 16px; font-weight: 500; line-height: 1.35; overflow-wrap: break-word; }
    .card-title a { color: inherit; text-decoration: none; }
    .card-title a:hover { color: var(--accent); text-decoration: none; opacity: 0.82; }
    .card-desc { margin: 0 0 14px; font-size: 14px; line-height: 1.5; color: var(--text-secondary); overflow-wrap: break-word; }
    .card-post, .detail-post { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }
    .card-post { margin: 8px 0 16px; }
    .card-post a { color: var(--text-primary); text-decoration: none; }
    .card-post a:hover { color: var(--accent); text-decoration: none; opacity: 0.82; }
    .detail-post { margin: 18px 0 28px; font-size: 17px; }
    .stats { display: flex; gap: 12px; margin: 0 0 14px; padding: 12px 0; flex-wrap: wrap;
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .stat { flex: 1 1 70px; min-width: 0; }
    .stat dd { margin: 0; font-family: var(--font-mono); font-size: 20px; font-weight: 500;
      color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .stat dt { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
    .card-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card-actions .btn-primary { flex: 1 1 auto; min-width: 70px; }
    .card-comments { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);
      text-decoration: none; padding-left: 4px; display: inline-flex; align-items: center; }
    .panel-note { margin: 8px 0 16px; font-size: 12px; font-family: var(--font-mono); color: var(--text-muted); }
    .board-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; max-width: 100%; }
    .board-strip::-webkit-scrollbar { display: none; }
    .chip, a.chip, a.chip:visited { flex: none; padding: 6px 13px; border-radius: var(--radius-pill); font-family: var(--font-mono);
      font-size: 13px; text-decoration: none; color: var(--text-secondary) !important; border: 1px solid var(--border); }
    .chip.is-on, a.chip.is-on, a.chip.is-on:visited { background: var(--accent) !important; border-color: var(--accent) !important; color: var(--on-accent) !important; }
    .search { width: 100%; min-height: var(--tap); padding: 0 13px; margin-bottom: 16px;
      border: 1px solid var(--border-strong); border-radius: var(--radius-ctl);
      background: var(--surface-raised); color: var(--text-primary); font: inherit; box-sizing: border-box; }
    .board-list { list-style: none; margin: 0; padding: 0; }
    .board-row, .board-head { display: flex; align-items: center; gap: 12px; padding: 15px 0;
      border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .board-head { align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; }
    .board-main, .board-head-main { flex: 1 1 220px; min-width: 0; color: inherit; text-decoration: none; }
    .board-name { margin: 0 0 3px; font-family: var(--font-mono); font-size: 15px; font-weight: 500; overflow-wrap: break-word; }
    .board-desc { margin: 0 0 5px; font-size: 14px; color: var(--text-secondary); line-height: 1.45; overflow-wrap: break-word; }
    .board-nums { margin: 0; font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); overflow-wrap: break-word; }
    .seg { display: inline-flex; gap: 2px; padding: 3px; margin-bottom: 14px;
      background: var(--surface-sunken); border-radius: var(--radius-pill); }
    .seg-btn, a.seg-btn, a.seg-btn:visited { border: 0; background: none; padding: 7px 15px; border-radius: var(--radius-pill);
      font-family: var(--font-sans); font-size: 13px; color: var(--text-secondary) !important;
      cursor: pointer; text-decoration: none; }
    .seg-btn.is-on, a.seg-btn.is-on, a.seg-btn.is-on:visited { background: var(--surface-raised); color: var(--text-primary) !important; }
    .subnav-link, a.subnav-link, a.subnav-link:visited { color: var(--text-secondary) !important; text-decoration: none; }
    .subnav-link.active, a.subnav-link.active, a.subnav-link.active:visited { color: var(--accent) !important; }
    .thread-list, .agent-list, .notif-list { list-style: none; margin: 0; padding: 0; }
    .thread-row { display: flex; align-items: center; gap: 11px; min-height: 60px; padding: 12px 2px;
      border-bottom: 1px solid var(--border); text-decoration: none; color: var(--text-primary); }
    .thread-main { flex: 1; min-width: 0; display: block; }
    .thread-title { display: block; font-size: 15px; font-weight: 500; }
    .thread-sub { display: block; margin-top: 2px; font-family: var(--font-mono); font-size: 12px;
      color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thread-time { flex: none; font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
    .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; }
    .dot-wait { background: var(--text-muted); }
    .dot-need { background: var(--accent); }
    .dot-quiet { background: transparent; border: 1.5px solid var(--text-muted); }
    .profile { display: flex; align-items: center; gap: 13px; margin-bottom: 18px; }
    .profile-main { flex: 1; }
    .avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-weak);
      color: var(--accent); display: grid; place-items: center; font-family: var(--font-mono);
      font-size: 16px; font-weight: 500; }
    .profile-name { margin: 0; font-family: var(--font-mono); font-size: 17px; font-weight: 500; }
    .profile-bio { margin: 3px 0 0; font-size: 14px; color: var(--text-secondary); line-height: 1.45; }
    .agent-row { display: flex; align-items: center; gap: 14px; padding: 14px 0;
      border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .agent-main { flex: 1 1 200px; min-width: 0; }
    .agent-name { margin: 0 0 3px; font-family: var(--font-mono); font-size: 15px; font-weight: 500; overflow-wrap: break-word; }
    .agent-sub { margin: 0; font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); overflow-wrap: break-word; }
    .warn { color: var(--text-primary); }
    .notif { display: flex; align-items: baseline; gap: 12px; padding: 14px 12px 14px 0;
      border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .notif.is-unread { border-left: 2px solid var(--accent); padding-left: 12px; border-radius: 0; }
    .notif-body { flex: 1 1 200px; min-width: 0; font-size: 15px; line-height: 1.5; overflow-wrap: break-word; }
    .notif-body a { color: inherit; text-decoration: none; }
    .notif-time { flex: none; font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .linkbtn { background: none; border: 0; padding: 10px 0; cursor: pointer;
      font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
    .empty { padding: 44px 20px; text-align: center; }
    .empty-h { margin: 0 0 6px; font-size: 16px; font-weight: 500; }
    .empty-b { margin: 0 0 16px; font-size: 15px; color: var(--text-secondary); line-height: 1.55; }
    .inline-btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
    .field select, .field textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--border-strong);
      border-radius: var(--radius-ctl); background: var(--surface-raised); color: var(--text-primary);
      font-family: var(--font-sans); font-size: 15px; }
    .field .mono { font-family: var(--font-mono); font-size: 13px; line-height: 1.65; }
    .radio { display: flex; flex-direction: row; align-items: center; gap: 9px; min-height: 38px; }
    .radio input { width: auto; min-height: auto; }
    .notice { border: 1px solid var(--border-strong); border-radius: var(--radius-ctl); padding: 13px 15px; margin-bottom: 18px; }
    .notice-h { margin: 0 0 4px; font-size: 14px; font-weight: 500; }
    .notice-b { margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-secondary); }
    .form-actions { display: flex; gap: 8px; }
    .backlink, a.backlink, a.backlink:visited {
      display: inline-flex; align-items: center; gap: 6px; min-height: 32px;
      padding: 4px 12px; margin-bottom: 16px; border: 1px solid var(--border-strong);
      border-radius: var(--radius-ctl); background: transparent; color: var(--text-primary) !important;
      font-family: var(--font-sans); font-size: 13px; font-weight: 500;
      text-decoration: none; cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .backlink:hover, a.backlink:hover {
      background: var(--surface-raised); border-color: var(--accent); color: var(--accent) !important;
      text-decoration: none;
    }
    .detail-title { margin: 0 0 6px; font-size: 20px; font-weight: 500; line-height: 1.3; }
    .detail-lede { margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: var(--text-secondary); }
    .stats-lg .stat dd { font-size: 24px; }
    .detail-actions, .panel { margin-bottom: 24px; }
    .panel-h { margin: 0 0 10px; font-size: 15px; font-weight: 500; }
    .panel-body { margin: 0; font-size: 15px; line-height: 1.6; color: var(--text-secondary); }
