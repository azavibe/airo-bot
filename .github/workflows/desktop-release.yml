# Builds the Airobot desktop app (src-tauri) for Windows and macOS and
# publishes the installers on a GitHub Release.
#
# Publish a GitHub Release named v<version> (or push that tag) and this
# builds the installers for that version and attaches them to the release.
# You can also start it from the Actions tab ("Run workflow").
#
# A published release is built from the branch it targets (normally main),
# not from whatever commit an old tag with the same name points at, so a tag
# left over from an earlier attempt cannot make it build the wrong code. The
# version in the app's files (Cargo.toml, src-tauri/Cargo.toml,
# src-tauri/tauri.conf.json, web/package.json) must equal the release name
# minus the "v"; the first step checks that and says what to bump.
#
# Publishing on a brand new tag fires both the tag push and the release
# event. The runs share a group, so the second waits for the first and then
# replaces the same files.
#
# The builds are not code-signed yet: macOS shows an "unidentified
# developer" warning (right-click the app, then Open) and Windows
# SmartScreen asks once. To sign, add the Apple and Windows signing
# secrets described at https://v2.tauri.app/distribute/sign/ and pass them
# in the tauri-action step's env.
name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Airobot web app the desktop window opens (https)"
        required: false
        default: "https://airo-bot.com"
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Separate Mac builds so each installer carries only its own
          # PostgreSQL (the local database shipped inside the app).
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            postgres_target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            postgres_target: x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            args: ""
            rust_targets: ""
            postgres_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      AIROBOT_APP_URL: ${{ github.event.inputs.app_url || 'https://airo-bot.com' }}
      POSTGRES_VERSION: "16.16.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A published release builds what it targets (main), not an old tag.
          ref: ${{ github.event_name == 'release' && github.event.release.target_commitish || '' }}

      # The installers go to the release named v<version>, taken from the
      # app's own version files. Make sure that is the release being built.
      - name: Check the version matches the release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          from_file() { sed -n "$2" "$1" | head -1; }
          app=$(from_file src-tauri/tauri.conf.json 's/^ *"version": *"\([^"]*\)".*/\1/p')
          tauri_crate=$(from_file src-tauri/Cargo.toml 's/^version *= *"\([^"]*\)".*/\1/p')
          server=$(from_file Cargo.toml 's/^version *= *"\([^"]*\)".*/\1/p')
          web=$(from_file web/package.json 's/^ *"version": *"\([^"]*\)".*/\1/p')
          echo "tauri.conf.json=$app src-tauri/Cargo.toml=$tauri_crate Cargo.toml=$server web/package.json=$web"
          if [ -z "$app" ] || [ "$app" != "$tauri_crate" ] || [ "$app" != "$server" ] || [ "$app" != "$web" ]; then
            echo "::error::The version files disagree. Make them all the same version, merge that, then release."
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            release) want="$RELEASE_TAG" ;;
            push) want="$GITHUB_REF_NAME" ;;
            *) want="v$app" ;;
          esac
          if [ "$want" != "v$app" ]; then
            echo "::error::Release $want would be built from files that say version $app. Bump the version to ${want#v} (in the four files above), merge it, then publish the release again."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            # By hand from a side branch: never add to a release whose tag is
            # on another commit.
            git fetch --quiet --tags origin
            if tagged=$(git rev-parse --verify --quiet "refs/tags/v$app^{commit}"); then
              if [ "$tagged" != "$(git rev-parse HEAD)" ]; then
                echo "::error::Release v$app already exists on another commit ($tagged). Run this on $DEFAULT_BRANCH, or bump the version."
                exit 1
              fi
            fi
          fi
          git fetch --quiet --tags origin 2>/dev/null || true
          if tagged=$(git rev-parse --verify --quiet "refs/tags/v$app^{commit}") && [ "$tagged" != "$(git rev-parse HEAD)" ]; then
            echo "::warning::Tag v$app points at ${tagged:0:7}, but the installers are built from $(git rev-parse --short HEAD) (what the release targets). The version is right; only the tag is older."
          fi
          echo "Building installers for v$app and attaching them to release v$app"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable (pinned commit)
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Check the app URL
        shell: bash
        run: |
          case "$AIROBOT_APP_URL" in
            https://*) ;;
            *) echo "app_url must start with https://" >&2; exit 1 ;;
          esac

      # The window shows this computer's own Airobot (127.0.0.1) or the
      # hosted site; only those may call the desktop's commands.
      - name: Trust the app URL in the desktop capability
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const p = "src-tauri/capabilities/remote.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            const origin = new URL(process.env.AIROBOT_APP_URL).origin;
            // The cloud site, plus the Airobot on this computer (local mode).
            c.remote.urls = [origin + "/*", "http://127.0.0.1:*"];
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            console.log("trusted:", c.remote.urls);
          '

      # The app's private database: an unpacked PostgreSQL for this
      # platform, trimmed of headers, docs and static libraries.
      - name: Bundle PostgreSQL ${{ env.POSTGRES_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          name="postgresql-${POSTGRES_VERSION}-${{ matrix.postgres_target }}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pg.tar.gz" \
            "https://github.com/theseus-rs/postgresql-binaries/releases/download/${POSTGRES_VERSION}/${name}.tar.gz"
          # Relative names: GNU tar on Windows reads "D:\..." as a remote host.
          (cd "$RUNNER_TEMP" && tar -xzf pg.tar.gz)
          dest=src-tauri/resources/postgres
          find "$dest" -mindepth 1 ! -name README.md -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/$name/." "$dest/"
          rm -rf "$dest/include" "$dest/share/doc" "$dest/lib/pgxs"
          find "$dest/lib" -name '*.a' -delete
          du -sh "$dest"
          test -e "$dest/bin/initdb" || test -e "$dest/bin/initdb.exe"

      - name: Build the web bundle
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build and publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Airobot's own Google sign-in ("Desktop app" OAuth client), built
          # into the app so people connect Gmail, Calendar and Sheets with
          # one click. Google does not treat a desktop client's secret as
          # confidential; it still lives in secrets, not in the repository.
          # Unset: Google is set up in the app's Settings instead.
          AIROBOT_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.AIROBOT_GOOGLE_DESKTOP_CLIENT_ID }}
          AIROBOT_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.AIROBOT_GOOGLE_DESKTOP_CLIENT_SECRET }}
        with:
          projectPath: src-tauri
          tauriScript: npx --yes @tauri-apps/cli@2.12.4
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: Airobot v__VERSION__
          releaseBody: |
            Airobot on your own computer: no website, account or credits needed. Your office runs privately on this computer (with its own built-in database), and your bots answer chats and do tasks with the AI you already have: Claude Code (Claude Pro/Max), Codex (ChatGPT plans), OpenCode, Gemini CLI, or a free local Ollama model. Pick it in Connect Devices → AI on this computer. Airobot Cloud is optional (tray menu → Switch to Airobot Cloud).

            - **Mac:** take the `aarch64` file for Apple Silicon (M1 and later) or `x64` for Intel.

            - **macOS:** download the `.dmg`, drag Airobot to Applications. These builds are not signed yet: the first time, right-click Airobot → Open.
            - **Windows:** run the `.msi` or `-setup.exe`. SmartScreen may ask once (More info → Run anyway).

            Dictation and spoken replies are in Settings → Voice.
          releaseDraft: false
          prerelease: true
