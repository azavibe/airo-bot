name: CLA

# Asks each pull request author to agree to CLA.md once, by commenting
# "I have read the CLA Document and I hereby sign the CLA". Signatures are
# stored in signatures/cla.json on the `cla-signatures` branch, so they never
# need a commit to the protected main branch.
#
# pull_request_target runs this workflow from main, never from the pull
# request's code, which is what makes it safe to give it write access.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: azavibe,dependabot[bot],github-actions[bot]
