name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search existing issues first.
        Security problems go through SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where do you run Airobot?
      options:
        - Desktop app (macOS)
        - Desktop app (Windows)
        - Self-hosted (Docker)
        - Self-hosted (from source)
        - Airobot Cloud
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.6.0"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any keys, tokens or personal data first.
      render: text
